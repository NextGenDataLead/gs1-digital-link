name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check

      - name: Ruff format check
        run: ruff format --check

      - name: Type-check (mypy --strict)
        run: mypy --strict lib

      # The MCP servers gate their write tools on lib/gates.py via a generated TypeScript module.
      # A gate added here but not regenerated there quietly stops being shown on that surface.
      - name: Gate contract is exported to the MCP servers
        run: python -m scripts.export_gates --check

      - name: Tests
        run: pytest

      # The operator's machine installs from uv.lock, not from a fresh resolution, so a lock
      # that has drifted from pyproject.toml means that machine gets something nobody tested.
      # This job keeps installing with pip above — the check asserts the lockfile is current,
      # it does not change what CI resolves. uv is pinned to the version that wrote the lock;
      # bump it here, in install.command and in install.bat together.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.6/install.sh \
            | env UV_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lockfile matches pyproject
        run: uv lock --check

  # The job above installs `.[dev]` deliberately: that is what proves lib and scripts never grow
  # a NiceGUI dependency, and that the suite passes without one. The side effect was that every
  # module under ui/pages/ went untested — which is how three production bugs shipped green in a
  # single week (#52, #53, #54), one of them with a test asserting the broken behaviour. This job
  # is the other half. Keep them separate: merging them would cost the proof above.
  ui:
    name: Operator shell (ui extra)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      # Bare, with no -m: a command-line -m *replaces* the `-m 'not staging'` in pyproject.toml
      # rather than adding to it, which would arm the tests that write to live WordPress and GS1.
      - name: Operator shell tests
        run: pytest tests/ui

  # Windows is a supported platform, for operating the tool and for developing it. Every job
  # above is Linux, so nothing proved the suite — or the shell's subprocess pipes, which get the
  # ANSI code page there — on the platform it is used on. The installers have their own Windows
  # job in installers.yml; this one is the code. It installs the way the docs tell a Windows
  # developer to: from uv.lock, dev and ui together.
  windows:
    name: Tests on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"

      - name: Install dependencies
        run: uv sync --python 3.11 --extra dev --extra ui --locked

      # Bare, as above: a command-line -m would replace the `-m 'not staging'` default.
      - name: Tests
        run: uv run --frozen pytest

  gs1-nl-mcp:
    name: Build and test gs1-nl MCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm -w mcps/gs1-nl run build

      - name: Tests
        run: npm -w mcps/gs1-nl test

  wordpress-mcp:
    name: Build and test wordpress MCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm -w mcps/wordpress run build

      - name: Tests
        run: npm -w mcps/wordpress test

  qr-render-mcp:
    name: Build and test qr-render MCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm -w mcps/qr-render run build

      - name: Tests
        run: npm -w mcps/qr-render test
